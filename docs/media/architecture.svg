<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="requiem-gui, the requiem CLI and the Raycast extension talk to the requiemd player over a Unix socket; requiemd plays from YouTube Music and Spotify">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C70F5"/>
      <stop offset="1" stop-color="#EBA6D2"/>
    </linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#7C70F5"/>
      <stop offset="1" stop-color="#EBA6D2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .title { fill: #F2F2F5; font-size: 15px; font-weight: 600; }
    .sub { fill: #8E8E9A; font-size: 12px; }
    .label { fill: #8E8E9A; font-size: 11px; letter-spacing: 0.08em; }
    .box { fill: #1A1A20; stroke: #34343F; }
    .wire { fill: none; stroke: #34343F; stroke-width: 2; }
    .flow { fill: none; stroke: url(#wire); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 14; animation: flow 1.2s linear infinite; }
    .back { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    .beat { transform-box: fill-box; transform-origin: center bottom; animation: beat 1.4s ease-in-out infinite; }
    .d1 { animation-delay: -0.8s; } .d2 { animation-delay: -0.2s; } .d3 { animation-delay: -1.1s; } .d4 { animation-delay: -0.5s; }
    @keyframes beat { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } }
    @media (prefers-reduced-motion: reduce) { .flow, .beat { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="#0A0A0C" stroke="#22222A"/>

  <text class="label" x="40" y="38">CLIENTS</text>
  <text class="label" x="350" y="38">PLAYER</text>
  <text class="label" x="660" y="38">SERVICES</text>

  <!-- wires: clients to player -->
  <path class="wire" d="M240 85 C 295 85, 295 150, 350 150"/>
  <path class="wire" d="M240 160 L 350 160"/>
  <path class="wire" d="M240 235 C 295 235, 295 170, 350 170"/>
  <path class="flow" d="M240 85 C 295 85, 295 150, 350 150"/>
  <path class="flow back" d="M240 160 L 350 160"/>
  <path class="flow" d="M240 235 C 295 235, 295 170, 350 170"/>
  <text class="sub" x="295" y="278" text-anchor="middle">Unix socket</text>

  <!-- wires: player to services -->
  <path class="wire" d="M560 150 C 610 150, 610 110, 660 110"/>
  <path class="wire" d="M560 170 C 610 170, 610 210, 660 210"/>
  <path class="flow back" d="M560 150 C 610 150, 610 110, 660 110"/>
  <path class="flow back" d="M560 170 C 610 170, 610 210, 660 210"/>

  <!-- clients -->
  <rect class="box" x="40" y="58" width="200" height="54" rx="10"/>
  <text class="title" x="56" y="81">requiem-gui</text>
  <text class="sub" x="56" y="99">native window · macOS</text>

  <rect class="box" x="40" y="133" width="200" height="54" rx="10"/>
  <text class="title" x="56" y="156">requiem</text>
  <text class="sub" x="56" y="174">CLI · --json for scripts</text>

  <rect class="box" x="40" y="208" width="200" height="54" rx="10"/>
  <text class="title" x="56" y="231">Raycast</text>
  <text class="sub" x="56" y="249">extension · via the CLI</text>

  <!-- player -->
  <rect x="350" y="70" width="210" height="180" rx="14" fill="#121216" stroke="url(#accent)" stroke-width="1.5"/>
  <g fill="url(#accent)">
    <rect class="beat d1" x="370" y="98" width="7" height="16" rx="3.5"/>
    <rect class="beat d2" x="381" y="90" width="7" height="24" rx="3.5"/>
    <rect class="beat d3" x="392" y="86" width="7" height="28" rx="3.5"/>
    <rect class="beat d4" x="403" y="94" width="7" height="20" rx="3.5"/>
  </g>
  <text class="title" x="420" y="110">requiemd</text>
  <text class="sub" x="370" y="146">queue · audio · state</text>
  <text class="sub" x="370" y="168">menu bar · Now Playing</text>
  <text class="sub" x="370" y="190">tray · MPRIS (Linux)</text>
  <text class="sub" x="370" y="212">media keys</text>
  <text class="sub" x="370" y="234">plays with window closed</text>

  <!-- services -->
  <rect class="box" x="660" y="83" width="180" height="54" rx="10"/>
  <circle cx="684" cy="110" r="9" fill="#FF0033"/>
  <path d="M681 105.5 L 688 110 L 681 114.5 Z" fill="#fff"/>
  <text class="title" x="702" y="106">YouTube Music</text>
  <text class="sub" x="702" y="124">search · stream</text>

  <rect class="box" x="660" y="183" width="180" height="54" rx="10"/>
  <circle cx="684" cy="210" r="9" fill="#1ED760"/>
  <path d="M679 207 Q 684 205 689.5 208 M680 210.5 Q 684.5 209 688.5 211.5 M681 214 Q 684.5 213 687.5 215" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text class="title" x="702" y="206">Spotify</text>
  <text class="sub" x="702" y="224">librespot · Premium</text>
</svg>
