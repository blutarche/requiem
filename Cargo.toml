[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.9"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blutarche/requiem"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crossbeam-channel = "0.5"
symphonia = { version = "=0.6.1", default-features = false, features = ["mkv", "isomp4", "aac", "ogg", "vorbis"] }
symphonia-adapter-libopus = { version = "=0.3.0", default-features = false }
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.0"
ureq = "3.4.2"
ring = "0.17.14"
semver = "1.0.28"
libc = "0.2.190"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-media-player = { version = "0.3.2", default-features = false }
block2 = "0.6.2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# A git revision: crates.io 0.8.0 does not build (librespot #1760).
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e" }
protobuf = "3.7.2"
tokio = { version = "1.53.3", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
log = "0.4.34"

requiem-core = { path = "crates/requiem-core" }
requiem-audio = { path = "crates/requiem-audio" }
requiem-provider-ytmusic = { path = "crates/requiem-provider-ytmusic" }
requiem-provider-spotify = { path = "crates/requiem-provider-spotify" }
requiem-cli = { path = "crates/requiem-cli" }
requiem-ipc = { path = "crates/requiem-ipc" }
requiem-macos = { path = "crates/requiem-macos" }
requiem-linux = { path = "crates/requiem-linux" }
requiem-update = { path = "crates/requiem-update" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
