[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blutarche/requiem"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crossbeam-channel = "0.5"
symphonia = { version = "=0.6.1", default-features = false, features = ["mkv", "isomp4", "aac"] }
symphonia-adapter-libopus = { version = "=0.3.0", default-features = false }
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.0"
ureq = "3.4.2"
libc = "0.2.190"

requiem-core = { path = "crates/requiem-core" }
requiem-audio = { path = "crates/requiem-audio" }
requiem-provider-ytmusic = { path = "crates/requiem-provider-ytmusic" }
requiem-cli = { path = "crates/requiem-cli" }
requiem-ipc = { path = "crates/requiem-ipc" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
