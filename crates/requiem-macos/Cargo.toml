[package]
name = "requiem-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
requiem-core.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSObjCRuntime",
    "NSObject",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-media-player = { workspace = true, features = [
    "std",
    "block2",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }
