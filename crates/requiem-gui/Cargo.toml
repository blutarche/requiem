[package]
name = "requiem-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "requiem-gui"
path = "src/main.rs"

# AppKit views need the main thread, which only a test without the harness runs on.
[[test]]
name = "shelves"
harness = false

[dependencies]
requiem-core.workspace = true
requiem-ipc.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
requiem-macos.workspace = true
crossbeam-channel.workspace = true
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGDataProvider", "CGFont"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CTFontManager"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSAlert",
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPopUpButton",
    "NSPopUpButtonCell",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScrollView",
    "NSSecureTextField",
    "NSStringDrawing",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSTrackingArea",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
